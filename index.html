<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1 id="periodTitle">Today</h1>
    <div class="crumb">
      <span id="todayLabel"></span> · <span id="clock"></span> · <span id="dueSummary"></span>
    </div>
  </div>

  <div class="controls">
    <div class="segmented" role="tablist" aria-label="View">
      <button data-view="day" role="tab">Day</button>
      <button data-view="workweek" role="tab" title="Monday to Friday">Work</button>
      <button data-view="week" role="tab">Week</button>
      <button data-view="month" role="tab">Month</button>
    </div>
    <div class="nav">
      <button id="prevBtn" class="ghost" title="Previous">‹</button>
      <button id="todayBtn" class="ghost wide">Today</button>
      <button id="nextBtn" class="ghost" title="Next">›</button>
    </div>
    <input id="search" type="search" placeholder="Search tasks…" autocomplete="off">
    <select id="filterSection"><option value="">All sections</option></select>
    <select id="filterProject"><option value="">All projects</option></select>
    <select id="filterPerson"><option value="">Everyone</option></select>
    <button id="starBtn" class="ghost" aria-pressed="false" title="Show favourites only">★</button>
    <button id="hideDoneBtn" class="ghost wide" aria-pressed="false">Hide done</button>
    <button id="newTaskBtn" class="primary">+ Add task</button>
    <button id="cloudBtn" class="ghost wide" title="Sync across devices">Sign in</button>
    <div class="menu">
      <button id="menuBtn" class="ghost" aria-haspopup="true">⋯</button>
      <div id="menuList" class="menu-list" hidden>
        <button id="sectionsBtn">Sections…</button>
        <button id="sortBtn">Sort by time</button>
        <button id="rollOverdueBtn">Pull overdue into today</button>
        <button id="exportBtn">Export JSON</button>
        <button id="importBtn">Import JSON</button>
        <button id="seedBtn">Load sample data</button>
        <button id="resetBtn" class="danger">Clear everything</button>
      </div>
    </div>
  </div>
</header>

<main id="view" class="view"></main>

<input type="file" id="importFile" accept="application/json" hidden>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">New task</h2>
      <button id="modalClose" class="ghost">✕</button>
    </div>
    <form id="taskForm">
      <label>Task
        <input name="title" required maxlength="200" placeholder="What needs doing?">
      </label>
      <label>Notes
        <textarea name="notes" rows="3" placeholder="Any detail…"></textarea>
      </label>

      <div class="row">
        <label>Section
          <select name="section"></select>
        </label>
        <label>Project
          <input name="project" list="projectList" placeholder="Which project?">
          <datalist id="projectList"></datalist>
        </label>
      </div>

      <div class="row">
        <label>Assigned to
          <input name="assignee" list="peopleList" placeholder="Unassigned">
          <datalist id="peopleList"></datalist>
        </label>
        <label>Priority
          <select name="priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label>Date
          <input name="date" type="date" required>
        </label>
        <label>Time
          <input name="time" type="time">
        </label>
        <label>Status
          <select name="status" id="statusSelect"></select>
        </label>
      </div>

      <div class="subtasks-field">
        <div class="sf-head">
          <span>Subtasks</span>
          <span id="subCount" class="sf-count"></span>
        </div>
        <ul id="subList" class="sf-list"></ul>
        <input id="subInput" type="text" placeholder="Add a subtask, then Enter">
      </div>

      <div class="modal-foot">
        <button type="button" id="deleteBtn" class="danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="sectionsModal" class="modal" hidden>
  <div class="modal-card narrow" role="dialog" aria-modal="true" aria-labelledby="sectionsTitle">
    <div class="modal-head">
      <h2 id="sectionsTitle">Sections</h2>
      <button id="sectionsClose" class="ghost">✕</button>
    </div>
    <p class="hint">Sections group tasks inside every day. Drag the handle to reorder,
      or double-click a section heading on the board to rename it there.</p>
    <ul id="sectionsList" class="sections-list"></ul>
    <form id="sectionAddForm" class="section-add">
      <input id="sectionAddInput" type="text" maxlength="40" placeholder="New section name">
      <button type="submit" class="primary">Add</button>
    </form>
    <div class="modal-foot">
      <span class="spacer"></span>
      <button type="button" id="sectionsDone" class="primary">Done</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script type="module" src="cloud.js"></script>
</body>
</html>
